<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>هدية ليكي 🎁</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;overflow-x:hidden;font-family:Arial,Tahoma,sans-serif;background:radial-gradient(circle at top,#fff7fb,#f7e9ff 45%,#eee4ff);color:#4d3151}
.app{min-height:100vh;display:grid;place-items:center;padding:24px} .screen{display:none;width:min(520px,100%);animation:fade .7s ease} .screen.active{display:block}
.card{position:relative;text-align:center;padding:28px 22px;border-radius:30px;background:rgba(255,255,255,.84);box-shadow:0 18px 55px rgba(89,44,100,.16);backdrop-filter:blur(10px)}
.hero-photo{width:100%;max-height:420px;object-fit:cover;border-radius:22px;display:block;margin-bottom:18px}
.small-photo{width:190px;height:190px;object-fit:cover;border-radius:50%;border:7px solid #fff;margin-bottom:10px}
.gift{font-size:68px;animation:bounce 1.5s infinite} .gift.big{font-size:90px}
h1{margin:10px 0 8px;font-size:28px} p{font-size:17px;line-height:1.8}
.password-box{display:grid;gap:12px;margin-top:18px} input,button{width:100%;border-radius:16px;padding:15px 16px;font-size:17px;font-family:inherit;border:0;outline:0}
input{background:#fff;border:2px solid #edd8ef;text-align:center} button{cursor:pointer;background:linear-gradient(135deg,#d98adf,#a98be9);color:white;font-weight:bold;box-shadow:0 8px 18px rgba(143,92,168,.25)}
.error{color:#c64b75;min-height:25px;margin:8px 0 0} .message-card{min-height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.typed{white-space:pre-wrap;text-align:right;width:100%;font-size:20px;line-height:2;margin-top:15px} .cursor{font-weight:bold;animation:blink .8s infinite}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden} .heart{position:absolute;bottom:-40px;font-size:20px;animation:float 6s linear forwards;opacity:.7}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}} @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes blink{50%{opacity:0}} @keyframes float{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@media(max-width:430px){h1{font-size:24px}.card{padding:20px 16px}.hero-photo{max-height:360px}}
</style>
</head>

<script>
const PASSWORD="2014";
const MESSAGE='مش عارفة أقولك إيه بس، الهدية دي أنا عملتها عشانك مخصوص، عشان أقولك إنك أحلى حاجة حصلتلي في حياتي. وبجد ربنا يخليكي ليا. إنتِ مش مجرد صاحبتي، إنتِ أختي وحبيبتي وكل حاجة. آسفة على كل مرة زعلتك فيها. يا رب دايمًا نفضل مع بعض.\n\nبجد بحب كل وقت بنقضيه سوا، وكل الهزار والضحك، وكل الذكريات اللي بينا. يا رب نفضل مع بعض دايمًا ونفضل نضحك ونهزر، ويا رب تدوم صداقتنا للأبد.\n\nوإن شاء الله نفضل صحاب ونفضل نعمل ذكريات أكتر وأكتر. بحبك يا صاحبتي، يا أجمل حاجة حصلتلي في حياتي، وربنا يخليكي ليا.\n\nإنتِ بجد من الناس اللي وجودهم في حياتي فرق معايا. وإن شاء الله، إن شاء الله، نفضل مع بعض ونكبر مع بعض.\n\nوبحبك أوي أوي 💗';
const screens=[passwordScreen,giftScreen,messageScreen];
function show(s){screens.forEach(x=>x.classList.remove("active"));s.classList.add("active");scrollTo(0,0)}
unlockBtn.onclick=()=>{if(passwordInput.value===PASSWORD){error.textContent="";show(giftScreen)}else{error.textContent="الباسورد مش صح، جربي تاني 💗";passwordInput.select()}};
passwordInput.onkeydown=e=>{if(e.key==="Enter")unlockBtn.click()};
let done=false;
openGiftBtn.onclick=()=>{show(messageScreen);if(done)return;done=true;let i=0,t=setInterval(()=>{typedMessage.textContent+=MESSAGE[i++]||"";if(i>=MESSAGE.length)clearInterval(t)},45)};
setInterval(()=>{let h=document.createElement("span");h.className="heart";h.textContent=["💗","💖","💕","✨"][Math.floor(Math.random()*4)];h.style.left=Math.random()*100+"vw";h.style.animationDuration=(4+Math.random()*4)+"s";document.querySelector(".hearts").appendChild(h);setTimeout(()=>h.remove(),8000)},650);
</script>
